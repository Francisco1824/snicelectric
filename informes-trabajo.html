<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Informes de trabajo | SNIC'ELECTRIC</title><link rel="stylesheet" href="css/inspection-styles.css"></head><body>
<header class="topbar no-print"><div class="topbar-brand"><img src="assets/logo.png"><div><strong>SNIC ELECTRIC</strong><span>Informes de trabajo en obra</span></div></div><nav class="topbar-actions"><a class="btn btn-light" href="dashboard.html">Panel</a><button class="btn btn-light" id="logoutBtn">Salir</button></nav></header><main class="container"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-client.js"></script><script>
let me=null,clients=[],reports=[];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){me=await snicAuth.require();if(!me)return;clients=await snicAuth.syncClientsToLocal();await loadReports();render();document.getElementById('logoutBtn').onclick=()=>snicAuth.logout()}
async function loadReports(){let q=snicSupabase.from('informes_trabajo').select('*').order('fecha_trabajo',{ascending:false});if(me.roleId!=='admin')q=q.eq('trabajador_id',me.id);const r=await q;if(r.error)throw r.error;reports=r.data||[]}
function clientName(id){const c=clients.find(x=>String(x.id)===String(id));return c?.nombre||'Cliente'}
function render(){document.querySelector('main').innerHTML=`<div class="page-heading"><div><h1>Informes de trabajo en obra</h1><p class="muted">El informe queda asociado al trabajador y a un cliente registrado.</p></div><button class="btn btn-primary" id="new">+ Nuevo informe</button></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Informe</th><th>Cliente</th><th>Trabajador</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>${reports.map(x=>`<tr><td>${e(x.numero||'—')}</td><td>${e(clientName(x.cliente_id))}</td><td>${e(x.trabajador_id===me.id?me.name:'')}</td><td>${e(x.fecha_trabajo||'')}</td><td>${e(x.estado||'')}</td><td><button class="btn btn-secondary" onclick="printR('${x.id}')">Imprimir/PDF</button></td></tr>`).join('')||'<tr><td colspan="6">No hay informes.</td></tr>'}</tbody></table></div></section>`;document.getElementById('new').onclick=newReport}
function newReport(){document.querySelector('main').innerHTML=`<div class="page-heading"><h1>Nuevo informe de trabajo</h1></div><section class="card"><div class="form-grid"><label>Cliente registrado<select id="c"><option value="">Seleccione un cliente</option>${clients.map(c=>`<option value="${e(c.id)}">${e(c.nombre)}${c.doc?' — '+e(c.doc):''}</option>`).join('')}</select></label><label>Trabajador<input value="${e(me.name)}" readonly></label><label>Fecha<input id="d" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Lugar / obra<input id="l"></label><label style="grid-column:1/-1">Trabajo realizado<textarea id="t" rows="6"></textarea></label><label style="grid-column:1/-1">Materiales utilizados<textarea id="m" rows="4"></textarea></label><label style="grid-column:1/-1">Observaciones<textarea id="o" rows="4"></textarea></label><label style="grid-column:1/-1">Fotografías<input id="p" type="file" accept="image/*" multiple capture="environment"></label></div><div id="prev"></div><button class="btn btn-primary" id="save">Guardar informe</button> <button class="btn btn-light" onclick="render()">Cancelar</button></section>`;document.getElementById('p').onchange=preview;document.getElementById('save').onclick=saveReport}
function preview(ev){document.getElementById('prev').innerHTML=[...ev.target.files].slice(0,6).map(f=>`<span>${e(f.name)}</span>`).join('<br>')}
async function saveReport(){const cliente_id=document.getElementById('c').value, trabajo=document.getElementById('t').value.trim();if(!cliente_id)return alert('Selecciona un cliente registrado.');if(!trabajo)return alert('Completa el trabajo realizado.');const payload={cliente_id,trabajador_id:me.id,fecha_trabajo:document.getElementById('d').value,lugar:document.getElementById('l').value,trabajo_realizado:trabajo,materiales_utilizados:document.getElementById('m').value,observaciones:document.getElementById('o').value,estado:'borrador'};const r=await snicSupabase.from('informes_trabajo').insert(payload).select().single();if(r.error)return alert('No se pudo guardar: '+r.error.message);const files=[...document.getElementById('p').files].slice(0,6);for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`informes/${me.id}/${r.data.id}/${Date.now()}_${safe}`;const u=await snicSupabase.storage.from('snic-electric').upload(path,f);if(u.error)return alert('Informe creado, pero falló una foto: '+u.error.message);const a=await snicSupabase.from('archivos').insert({bucket:'snic-electric',ruta:path,nombre_archivo:f.name,tipo:'foto',mime_type:f.type,tamano:f.size,cliente_id, informe_id:r.data.id,usuario_id:me.id});if(a.error)return alert('Informe creado y foto subida, pero no se registró: '+a.error.message)}alert('Informe guardado correctamente en Supabase.');await loadReports();render()}
function printR(id){const x=reports.find(r=>r.id===id);if(!x)return;const c=clients.find(c=>String(c.id)===String(x.cliente_id))||{};document.body.innerHTML=`<main class="container"><article class="card"><img src="assets/logo.png" style="width:180px"><h1>INFORME DE TRABAJO EN OBRA</h1><h2>${e(x.numero||'')}</h2><p><b>Cliente:</b> ${e(c.nombre||'')}<br><b>Documento:</b> ${e(c.doc||'')}<br><b>Fecha:</b> ${e(x.fecha_trabajo||'')}<br><b>Lugar:</b> ${e(x.lugar||'')}<br><b>Trabajador:</b> ${e(me.name)}</p><h3>Trabajo realizado</h3><p>${e(x.trabajo_realizado||'')}</p><h3>Materiales</h3><p>${e(x.materiales_utilizados||'')}</p><h3>Observaciones</h3><p>${e(x.observaciones||'')}</p></article><button class="btn btn-primary no-print" onclick="window.print()">Imprimir / Guardar PDF</button></main>`}
boot();
</script></body></html>
