<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b356d"><title>SNIC Electric | Inspecciones</title>
<link rel="stylesheet" href="css/inspection-styles.css">
</head>
<body>
<header class="topbar no-print">
  <div class="topbar-brand"><img src="assets/logo.png" alt="SNIC Electric"><div><strong>SNIC ELECTRIC</strong><span>Mantenimiento eléctrico</span></div></div>
  <nav class="topbar-actions"><a class="btn btn-light" href="dashboard.html">Panel</a>
    <a id="adminLink" class="btn btn-light hidden" href="usuarios.html">Usuarios</a><a id="reportsLink" class="btn btn-light hidden" href="reportes.html">Reportes</a>

</header>
<main class="container">

    </table></div>
